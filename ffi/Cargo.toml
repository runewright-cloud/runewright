[package]
name = "runewright_ffi"
version = "0.1.0"
edition = "2021"

# cdylib  → Android/iOS .so / .dylib for flutter_rust_bridge
# staticlib → fallback for environments that need static linking
[lib]
name = "runewright_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# M3.4: switched from the zkmopro/noir-rs beta.19 spike pin to the production
# dependency, matching the main toolchain (nargo beta.20). barretenberg-rs
# version is unchanged (4.2.0-aztecnr-rc.2, pinned transitively by noir_rs) —
# the M3.3/M3.4 "Backend error: vector" investigation found the real bug was
# an unsigned underflow in barretenberg's own thread-pool sizing when
# hardware_concurrency() returns 0, not a dependency/artifact problem. See
# docs/M3_findings.md.
noir_rs = { git = "https://github.com/zkpassport/noir_rs.git", tag = "v1.0.0-beta.20-1", features = ["barretenberg"] }

# M4: direct access to the same Poseidon2 permutation the circuit's
# std::hash::poseidon2_permutation compiles down to (acvm-repo, part of the
# noir monorepo) -- pinned to the identical tag noir_rs already resolves
# transitively, so this is not a second implementation, just a direct call
# into the one the toolchain already uses. CLAUDE.md CIRCUIT_IO 1: never
# reimplement Poseidon2 in Dart; this keeps the only implementation in Rust,
# reachable from Dart only via FFI, for the owner_pubkey recompute step
# CIRCUIT_IO.md CIRCUIT_IO 5 requires of the verifying client.
# Pinned by `rev` (not `tag`) to match the exact source-identity string Cargo
# already resolves transitively via noir_rs -> nargo -> acvm, so this unifies
# to the one copy already being compiled rather than building a second one.
acir = { git = "https://github.com/noir-lang/noir.git", rev = "v1.0.0-beta.20" }
bn254_blackbox_solver = { git = "https://github.com/noir-lang/noir.git", rev = "v1.0.0-beta.20" }

flutter_rust_bridge = "=2.12.0"
serde_json = "1"
# Direct decode of the SRS cache file's Srs struct in get_srs_cached --
# pinned to the exact version noir_rs already resolves transitively (see
# Cargo.lock) so this isn't a second copy, and the wire format it decodes
# is byte-identical to what LocalSrs::save (noir_rs) writes.
bincode = "1.3.3"
# ctor: runs hardware_concurrency_workaround() at .so load time (DT_INIT_ARRAY),
# before any Rust/FRB code and certainly before any FRB worker thread can spawn
# and touch barretenberg's thread_local ThreadPool static. See prover.rs.
ctor = "0.2"

[features]
default = []
# Enable bundled SRS instead of network-fetch.  Pass the .dat file path at runtime.
bundled_srs = []

# ── Android cross-compilation ────────────────────────────────────────────────
# Build with: cargo ndk -t aarch64-linux-android -o ../android/app/src/main/jniLibs build --release
#
# Required one-time setup (in addition to bootstrap.sh):
#   cargo install cargo-ndk
#   rustup target add aarch64-linux-android
#   export ANDROID_NDK_HOME=<path to NDK r26+>

