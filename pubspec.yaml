name: rune_duel
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # M2 FFI spike: flutter_rust_bridge bindings + SRS path helper
  flutter_rust_bridge: ^2.0.0
  path_provider: ^2.1.0
  cryptography: ^2.9.0
  crypto: ^3.0.0
  flutter_secure_storage: ^10.3.1

  # M4: identity backup export/import file picking
  file_picker: ^11.0.2

  # M4: mDNS/NSD peer discovery for the LAN transport adapter
  nsd: ^5.0.1

  # Sorcerer mode: microphone capture (PCM-16 LE mono stream at 16 kHz)
  # Used by ReferenceMatchVocalScorer and AmbientCalibrator.
  # SherpaVocalScorer will additionally need sherpa_onnx once validated.
  record: ^7.1.1

  # Practice Mode: trainer-clip playback (Piper-rendered word/formula audio
  # under assets/audio/practice/). No audio-playback package existed before
  # this — flagged explicitly per the "no silent heavy deps" rule.
  audioplayers: ^6.1.0

  # Custom spell art (P1): decode/resize/re-encode of player-imported images.
  # New dependency, flagged per the "no silent heavy deps" rule. Note: this
  # package can DECODE WebP but cannot ENCODE it (no webp_encoder.dart in its
  # source), so P1 canonicalizes imported art to JPEG instead of WebP — see
  # lib/spells/spell_art_import.dart's header comment.
  image: ^4.8.0

  # Sorcerer mode: somatic-gesture capture (accelerometer + gyroscope
  # streams). Used only by lib/sorcerer/gesture_capture.dart — every other
  # gesture file (classifier, enrollment, DTW) is pure Dart over ImuSample
  # and never imports this package directly. See docs/SOMATIC_GESTURE_PLAN.md.
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  test: ^1.30.0

  # Spell-asset persistence tests: fakes path_provider's platform interface
  # (no native documents directory under headless `flutter test`).
  path_provider_platform_interface: ^2.1.0

  # Real-widget-tree, real-device UI verification (integration_test/): runs
  # against the actual Linux desktop engine/gesture pipeline rather than the
  # headless flutter_test binding. No screen-automation tooling (xdotool,
  # scrot) is installed on this machine and there's no root to add it, so
  # this is the mechanism for driving real taps through real rendering.
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/circuits/ca_spike_t12.json
    - assets/circuits/ca_spike_t24.json
    - assets/circuits/ca_spike_t48.json
    - assets/circuits/ca_spike_t12.vk
    - assets/circuits/ca_spike_t24.vk
    - assets/circuits/ca_spike_t48.vk
    - assets/circuits/ca_v2_4_tier12.json
    - assets/circuits/ca_v2_4_tier24.json
    - assets/circuits/ca_v2_4_tier48.json
    - assets/circuits/ca_v2_4_tier12.vk
    - assets/circuits/ca_v2_4_tier24.vk
    - assets/circuits/ca_v2_4_tier48.vk
    # Practice Mode: Piper-rendered trainer clips + MFCC reference templates.
    # Generated by scripts/generate_practice_assets.dart; see that file's
    # header and docs/M4_findings.md for the Piper toolchain provenance.
    - assets/audio/practice/
    - assets/practice_templates/
    # Built-in spell art pack (docs/SPELL_ART_PACK_PLAN.md). Generated by
    # scripts/build_art_pack.py from third-party sources -- see
    # assets/art_pack/painterly/ATTRIBUTION.md for licence/attribution.
    - assets/art_pack/painterly/
    # Battle-scenery hex terrain atlas (cosmetic backdrop only -- no gameplay
    # meaning). Generated by scripts/build_hex_terrain.py from the CC0 Screaming
    # Brain Studios pack; see assets/art_pack/terrain/ATTRIBUTION.md.
    - assets/art_pack/terrain/
    # Wizard avatar sprites (character tokens on the battlefield). Generated by
    # scripts/build_avatar_pack.py from the Kushnariova character pack. CC BY 3.0
    # -- attribution is REQUIRED; see assets/art_pack/avatars/ATTRIBUTION.md.
    - assets/art_pack/avatars/
    # Shipped starter spells (docs/BASIC_SPELLS_PLAN.md). Generated by
    # scripts/export_basic_spells.dart from an authored library; the JSON
    # carries real proofs and is loaded verbatim by lib/spells/basic_spell_seed.dart.
    - assets/basic_spells/
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
